name: Bug report
description: A Python program that py2cpp mishandles -- rejects incorrectly, accepts incorrectly, or compiles to C++ that behaves differently from CPython.
labels: ["bug"]
body:
  - type: textarea
    id: python-source
    attributes:
      label: Minimal Python source
      description: The smallest program that reproduces the issue. Please trim it down as far as it'll go.
      render: python
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of bug is this?
      options:
        - py2cpp rejects a program that should be in the supported subset
        - py2cpp accepts a program it should reject (and emits incorrect C++)
        - Compiled C++ behaves differently from running the same file with CPython
        - Something else (describe below)
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected py2cpp (or the compiled binary) to do.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: The diagnostic py2cpp printed, or the compiled binary's actual output. Include the full `P2C####` message if there is one.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: py2cpp version
      description: Output of `py2cpp --version`.
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version running py2cpp
      description: Output of `python --version`.
    validations:
      required: true

  - type: input
    id: cpp-compiler
    attributes:
      label: C++ compiler and version (if the bug is about compiled behavior)
      description: e.g. `g++ (GCC) 13.2.0`, `clang++ 17.0.0`, `MSVC 19.38`.

  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. Ubuntu 22.04, macOS 14, Windows 11.
