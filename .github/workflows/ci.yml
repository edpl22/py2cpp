name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Golden-case tests (tests/integration/test_golden.py) discover every
      # C++ compiler on PATH via shutil.which and skip (never fake) whichever
      # isn't present -- these steps exist so all three of g++/clang++/cl
      # actually get exercised on the platforms where they're available,
      # instead of silently skipping.
      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ruff
        run: ruff check .

      - name: mypy --strict
        run: mypy --strict src tests

      - name: pytest
        run: pytest
