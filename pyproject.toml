[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py2cpp"
dynamic = ["version"]
description = "A Python 3.10+ subset to C++17 transpiler"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/py2cpp/py2cpp"
Issues = "https://github.com/py2cpp/py2cpp/issues"

[project.scripts]
py2cpp = "py2cpp.cli:main"

[tool.hatch.version]
path = "src/py2cpp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/py2cpp"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=py2cpp --cov-report=term-missing"

[tool.coverage.run]
source = ["src/py2cpp"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
